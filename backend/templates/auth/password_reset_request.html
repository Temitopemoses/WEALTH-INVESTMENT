{% extends 'account/base.html' %}
{% load static %}

{% block title %} Password Reset Request {% endblock %}

{% block content %}

<!-- Profile Container -->
<div class="container profile-container">
    <div class="profile-header">
        <h3>Reset Your Password</h3>
        <p></p>
    </div>

    <div class="container">
        {% if messages %}
        <div class="alert alert-info alert-dismissible" role="alert">
            <div id="form_errors">
                {% for message in messages %}
                <strong> {{message}}</strong>
                {% endfor %}
            </div>
            <button type="buttom" class="close" data-dismiss="alert" arial-label="Close">
            <span arial-hidden="true">&times:</span>
            </button>
        </div>
        {% endif %}
    </div>


    <form method="POST", action="{% url 'password_reset_request' %}">
        {% csrf_token %}
        <!-- Name (Disabled) -->

        <!-- Email (Editable) -->
        <div class="form-group row">
            {% comment %} <label for="email" class="col-sm-3 col-form-label">Email</label> {% endcomment %}
            <div class="col-sm">
                <input type="email" class="form-control" name="email" id="email" placeholder="Enter your email address" required>
            </div>
        </div>
        <!-- Save Button -->
        <div class="form-group row">
            <div class="col-sm offset-sm">
                <center><button type="submit" class="btn btn-primary">Reset Password</button></center>
            </div>
        </div>
    </form>
</div>

{% endblock %}
