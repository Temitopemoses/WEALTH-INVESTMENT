<!-- Full-Width Image -->
<img src="img/Financial-business-statistics.jpeg" alt="Dashboard Header" class="header-image">

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Make Deposit</h3>
                    <p class="card-description"><small>Fill the form below</small></p>

                    <form method="post" name="spendform" class="forms-sample">
                        <div class="form-group">
                            <label class="form-control-label">Choose Plan: <span class="tx-danger">*</span></label>
                        
                    <select name="" class="form-control select2">
                                <option value="">Choose Plan</option>
                                <option value="1">Meta Trade Account</option>
                                <option value="2">Stock Market Account</option>
                                <option value="3">Real Estate Account</option>
                                <option value="4">Contract Account</option>
                                <option value="5">Retirement Account</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-control-label">Enter Amount: <span class="tx-danger">*</span></label>
                            <input type="text" name="amount" value="30.00" placeholder="10" class="form-control">
                        </div>

                        <div class="form-group">
                            <p>Select Payment Option</p>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="type" value="process_1000">
                                <label class="form-check-label">Bitcoin (BTC)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="type" value="process_1001">
                                <label class="form-check-label">Ethereum (ETH)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="type" value="process_1002">
                                <label class="form-check-label">USDT (TRC20)</label>
                            </div>
                        </div>

                        <button class="btn btn-success btn-long" type="submit">Make Deposit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Carousel -->
    <div id="cryptoCarousel" class="carousel slide mt-4" data-bs-ride="carousel">
        <div class="carousel-inner" id="crypto-carousel-content">
            <!-- Dynamic content will be inserted here -->
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#cryptoCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#cryptoCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
</div>

<script>
    async function fetchCryptoPrices() {
        // Fetching cryptocurrency prices from an API
        const apiKey = 'your_api_key_here';
        const apiUrl = `https://api.coinmarketcap.com/v1/cryptocurrency/listings/latest?CMC_PRO_API_KEY=${apiKey}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        // Populate the carousel with data
        const cryptoCarouselContent = document.getElementById('crypto-carousel-content');
        data.data.forEach((crypto, index) => {
            const isActive = index === 0 ? 'active' : '';
            cryptoCarouselContent.innerHTML += `
                <div class="carousel-item ${isActive}">
                    <div class="dashboard-card">
                        <h5>${crypto.name}</h5>
                        <p>Price: ${crypto.quote.USD.price.toFixed(2)} USD</p>
                    </div>
                </div>
            `;
        });
    }

    // Call the function to fetch and display prices
    fetchCryptoPrices();
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
